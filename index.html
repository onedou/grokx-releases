<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="GrokX 是面向 macOS 和 Windows 的 AI 编程助手桌面客户端。">
<link rel="icon" href="grokx-icon.png">
<title>GrokX — 桌面客户端</title>
<style>
:root {
  color-scheme: light;
  --paper: #fafaf8;
  --ink: #202126;
  --muted: #595e66;
  --line: #dedfdf;
  --blue: #145abe;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--paper); color: var(--ink); }
.shell { width: min(100% - 48px, 920px); margin-inline: auto; }
a { color: inherit; text-underline-offset: .25em; }
a:focus-visible { outline: 2px solid var(--blue); outline-offset: 5px; border-radius: 2px; }
nav, footer { display: flex; justify-content: space-between; align-items: center; gap: 16px; }
nav { height: 72px; border-bottom: 1px solid var(--line); }
.wordmark { font-size: 20px; font-weight: 700; letter-spacing: -.045em; }
nav a, footer a { text-decoration: none; }
nav a:hover, footer a:hover { text-decoration: underline; }
.hero { padding: clamp(54px, 8vw, 100px) 0 clamp(52px, 8vw, 92px); text-align: center; }
.hero img { display: block; margin: 0 auto 9px; width: 104px; height: 104px; }
h1 { font-size: clamp(64px, 11vw, 108px); line-height: .98; letter-spacing: -.055em; margin: 0 0 22px; }
.tagline { font-size: clamp(19px, 3vw, 25px); font-weight: 600; margin: 0 0 12px; }
.compatibility { max-width: 38em; margin: auto; color: var(--muted); line-height: 1.8; text-wrap: pretty; }
.downloads { width: min(100%, 650px); margin-inline: auto; }
.section-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; margin-bottom: 13px; }
h2 { margin: 0; font-size: 20px; }
.version { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
ul { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--line); }
li { border-bottom: 1px solid var(--line); }
.download { display: grid; grid-template-columns: 1fr auto; gap: 3px 16px; align-items: center; padding: 15px 12px; text-decoration: none; transition: background .15s; }
.download:hover { background: #eef1f5; }
.download strong { font-size: 17px; }
.detail { grid-row: 2; color: var(--muted); font-size: 13px; line-height: 1.5; }
.action { grid-column: 2; grid-row: 1 / 3; color: var(--blue); font-weight: 600; font-size: 14px; white-space: nowrap; }
footer { margin-top: clamp(52px, 8vw, 86px); padding: 19px 0 26px; border-top: 1px solid var(--line); color: var(--muted); font-size: 13px; }
@media (max-width: 460px) { .shell { width: calc(100% - 36px); } .hero img { width: 88px; height: 88px; } .download { padding-inline: 4px; } }
@media (prefers-reduced-motion: reduce) { .download { transition: none; } }
</style>
</head>
<body>
<nav class="shell" aria-label="主导航">
  <span class="wordmark">GrokX</span>
  <a href="https://github.com/onedou/grokx-releases">GitHub ↗</a>
</nav>
<main class="shell">
  <header class="hero">
    <img src="grokx-icon.png" alt="" width="104" height="104">
    <h1>GrokX</h1>
    <p class="tagline">AI 编程助手的桌面客户端</p>
    <p class="compatibility">支持 Grok Build、OpenCode、CodeBuddy Code 和 Google Antigravity CLI，按项目管理会话。</p>
  </header>
  <section class="downloads" aria-labelledby="downloads">
    <div class="section-head"><h2 id="downloads">下载安装包</h2><span class="version">当前版本 0.17.0</span></div>
    <ul>
      <li><a class="download" href="https://github.com/onedou/grokx-releases/releases/download/v0.17.0/GrokX_0.17.0_universal.dmg"><strong>macOS 通用版</strong><span class="detail">Apple 芯片与 Intel Mac · DMG · 11.9 MB</span><span class="action" aria-hidden="true">下载 ↓</span></a></li>
      <li><a class="download" href="https://github.com/onedou/grokx-releases/releases/download/v0.17.0/GrokX_0.17.0_x64-setup.exe"><strong>Windows x64</strong><span class="detail">Intel 与 AMD 电脑 · EXE · 4.4 MB</span><span class="action" aria-hidden="true">下载 ↓</span></a></li>
      <li><a class="download" href="https://github.com/onedou/grokx-releases/releases/download/v0.17.0/GrokX_0.17.0_arm64-setup.exe"><strong>Windows ARM64</strong><span class="detail">ARM64 电脑 · EXE · 4.0 MB</span><span class="action" aria-hidden="true">下载 ↓</span></a></li>
    </ul>
  </section>
</main>
<footer class="shell"><span>GrokX</span><a href="https://github.com/onedou/grokx-releases/releases">历史版本 ↗</a></footer>
</body>
</html>
